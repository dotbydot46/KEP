name: kep
description: Kankor exam preparation for students in Afghanistan.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.0.0+2
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdfviewer: ^35.1.40
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  translator: ^1.0.4+1
  shared_preferences: ^2.5.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/images/
    - assets/profile/
    - assets/pdf/
  fonts:
    - family: Courgette
      fonts:
        - asset: fonts/Courgette-Regular.ttf
